name: Desktop CI diagnostics
on: [push]
jobs:
  macos:
    name: macOS integration diagnostics
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test integration_test/native_assets_test.dart -d macos --reporter expanded --verbose
        timeout-minutes: 10
      - name: Collect application crash reports
        if: always()
        run: |
          sleep 5
          log show --last 3m --style compact --predicate 'process == "media_kit_test"' || true
          find ~/Library/Logs/DiagnosticReports -name '*media_kit*' -type f -print -exec cat {} \; || true
